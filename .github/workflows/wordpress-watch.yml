name: WordPress release watch

# Answers the question "how do I know to re-test when WordPress ships a major?"
#
# Nothing else in CI can tell you this. Dependabot watches composer packages and
# GitHub Actions; neither knows WordPress exists. So this job asks wordpress.org
# once a week and opens an issue when core moves ahead of what this plugin
# claims to be tested against.
#
# It deliberately ignores patch releases. WordPress minors are security and
# bugfix only and essentially never break a plugin. Reacting to every one of
# them is how a useful signal turns into noise you filter out.

on:
  schedule:
    - cron: '0 9 * * 1'   # Mondays, 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare core's version against "Tested up to"
        id: check
        run: |
          set -euo pipefail

          LATEST="$(curl -sS --fail --retry 3 \
            'https://api.wordpress.org/core/version-check/1.7/' \
            | jq -r '.offers[0].current')"

          TESTED="$(grep -m1 -i '^Tested up to:' readme.txt | sed 's/.*: *//' | tr -d '[:space:]')"

          echo "core=$LATEST  tested=$TESTED"

          # Major.minor only. 7.0.4 and 7.0 are the same thing for our purposes.
          maj () { printf '%s' "$1" | cut -d. -f1-2; }

          if [ "$(maj "$LATEST")" = "$(maj "$TESTED")" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
            echo "tested=$TESTED" >> "$GITHUB_OUTPUT"
          fi

      - name: Open an issue, unless one is already open
        if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.check.outputs.latest }}
          TESTED: ${{ steps.check.outputs.tested }}
        run: |
          set -euo pipefail
          TITLE="Re-test against WordPress $LATEST"

          if gh issue list --state open --search "$TITLE in:title" --json title \
             | grep -q "$TITLE"; then
            echo "Issue already open, nothing to do."
            exit 0
          fi

          gh issue create --title "$TITLE" --label "maintenance" --body "$(cat <<EOF
WordPress **$LATEST** is out. This plugin is marked \`Tested up to: $TESTED\`.

CI cannot check this for you. The test suites run against hand-rolled stubs
rather than a real WordPress install, so they will keep passing even if core
changes something this plugin depends on. This needs ten minutes by hand.

- [ ] Install $LATEST on the Local dev site
- [ ] Activate the plugin and exercise its main path
- [ ] Check the admin screen for PHP notices with \`WP_DEBUG\` on
- [ ] Bump \`Tested up to:\` in \`readme.txt\` and close this issue

Opened automatically by \`.github/workflows/wordpress-watch.yml\`.
EOF
)"
