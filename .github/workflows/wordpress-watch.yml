name: WordPress release watch

# Answers "how do I know to re-test when WordPress ships a major?"
#
# Nothing else in CI can tell you. Dependabot watches composer packages and
# GitHub Actions; neither knows WordPress exists. So this asks wordpress.org once
# a week and opens an issue when core moves ahead of what the plugin claims.
#
# It ignores patch releases on purpose. WordPress minors are security and bugfix
# only and essentially never break a plugin. Reacting to each one turns a useful
# signal into noise you learn to filter out.

on:
  schedule:
    - cron: '0 9 * * 1'   # Mondays, 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare core's version against "Tested up to"
        id: check
        run: |
          set -euo pipefail

          LATEST="$(curl -sS --fail --retry 3 \
            'https://api.wordpress.org/core/version-check/1.7/' \
            | jq -r '.offers[0].current')"

          TESTED="$(grep -m1 -i '^Tested up to:' readme.txt | sed 's/.*: *//' | tr -d '[:space:]')"

          echo "core=$LATEST  tested=$TESTED"

          # Major.minor only. 7.0.4 and 7.0 are the same thing here.
          maj () { printf '%s' "$1" | cut -d. -f1-2; }

          if [ "$(maj "$LATEST")" = "$(maj "$TESTED")" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true"       >> "$GITHUB_OUTPUT"
            echo "latest=$LATEST"   >> "$GITHUB_OUTPUT"
            echo "tested=$TESTED"   >> "$GITHUB_OUTPUT"
          fi

      - name: Open an issue, unless one is already open
        if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.check.outputs.latest }}
          TESTED: ${{ steps.check.outputs.tested }}
        run: |
          set -euo pipefail
          TITLE="Re-test against WordPress $LATEST"

          if gh issue list --state open --search "$TITLE in:title" --json title \
             | grep -q "$TITLE"; then
            echo "Issue already open, nothing to do."
            exit 0
          fi

          BODY="$RUNNER_TEMP/issue-body.md"
          {
            printf 'WordPress **%s** is out. This plugin is marked `Tested up to: %s`.\n\n' "$LATEST" "$TESTED"
            printf 'CI cannot check this for you. The test suites run against hand-rolled\n'
            printf 'stubs rather than a real WordPress install, so they keep passing even if\n'
            printf 'core changes something this plugin depends on. This needs ten minutes by\n'
            printf 'hand.\n\n'
            printf -- '- [ ] Install %s on the Local dev site\n' "$LATEST"
            printf -- '- [ ] Activate the plugin and exercise its main path\n'
            printf -- '- [ ] Check the admin screen for PHP notices with `WP_DEBUG` on\n'
            printf -- '- [ ] Bump `Tested up to:` in `readme.txt` and close this issue\n\n'
            printf 'Opened automatically by `.github/workflows/wordpress-watch.yml`.\n'
          } > "$BODY"

          gh issue create --title "$TITLE" --body-file "$BODY"
